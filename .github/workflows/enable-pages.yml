name: enable-pages
# GitHub MCP has no Pages tool, and GITHUB_TOKEN cannot create a Pages
# site (POST /repos/{owner}/{repo}/pages returns 403
# "Resource not accessible by integration" even with pages: write).
# Enable once in the repo UI: Settings → Pages → Deploy from a branch →
# Branch: main, Folder: / (root). After that, this workflow is unused.
on:
  workflow_dispatch:
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Enable Pages in Settings → Pages (source: main, folder: /)."
