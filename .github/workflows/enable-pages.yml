name: enable-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from main branch, root folder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "POST /pages HTTP ${code}"
          cat /tmp/out
          echo
          if [ "$code" = "201" ] || [ "$code" = "409" ]; then
            exit 0
          fi
          echo "unexpected status ${code}"
          exit 1
